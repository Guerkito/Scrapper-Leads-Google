services:
  panel:
    build: .
    image: onyx-leadgen:latest
    command: uvicorn web.app:app --host 0.0.0.0 --port 8502
    env_file: .env
    environment:
      - DB_PATH=/data/leads.db
    network_mode: host
    volumes:
      - onyx_data:/data
    restart: always

  webhook:
    image: onyx-leadgen:latest
    command: python webhook.py
    env_file: .env
    environment:
      - DB_PATH=/data/leads.db
    network_mode: host
    volumes:
      - onyx_data:/data
    restart: always
    depends_on:
      - panel

  email_agent:
    image: onyx-leadgen:latest
    command: python email_agent.py
    env_file: .env
    environment:
      - DB_PATH=/data/leads.db
    network_mode: host
    volumes:
      - onyx_data:/data
    restart: always
    depends_on:
      - panel

volumes:
  onyx_data:
